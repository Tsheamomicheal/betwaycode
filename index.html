<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Betway Soccer Predictor & Code Generator</title>
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        body {
            background-color: #f8f9fa;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        .navbar {
            background-color: #000;
        }
        .navbar-brand {
            color: #28a745 !important;
            font-weight: bold;
            text-transform: uppercase;
        }
        .match-card {
            border-radius: 10px;
            border: none;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            margin-bottom: 20px;
            transition: transform 0.2s;
        }
        .match-card:hover {
            transform: translateY(-5px);
        }
        .probability-bar {
            height: 10px;
            border-radius: 5px;
        }
        .btn-betway {
            background-color: #28a745;
            color: white;
            font-weight: bold;
        }
        .btn-betway:hover {
            background-color: #218838;
            color: white;
        }
        #bookingCodeResult {
            font-size: 2rem;
            font-weight: bold;
            color: #000;
            background: #e9ecef;
            padding: 20px;
            border-radius: 10px;
            letter-spacing: 2px;
        }
        .prediction-text {
            font-size: 0.9rem;
            font-weight: bold;
        }
        @keyframes pulse {
            0% { opacity: 1; }
            50% { opacity: 0.5; }
            100% { opacity: 1; }
        }
        .animate-pulse {
            animation: pulse 2s infinite;
        }
    </style>
</head>
<body>

    <nav class="navbar navbar-dark sticky-top">
        <div class="container">
            <a class="navbar-brand" href="#"><i class="fas fa-futbol me-2"></i>Betway Predictor</a>
        </div>
    </nav>

    <div class="container mt-4">
        <div class="row">
            <div class="col-md-10 offset-md-1">
                <div class="d-flex justify-content-between align-items-center mb-3">
                    <h3>Today's Matches</h3>
                    <button id="refreshBtn" class="btn btn-outline-dark btn-sm"><i class="fas fa-sync-alt"></i> Refresh</button>
                </div>
                <div id="matchList" class="row">
                    <!-- Matches will be loaded here -->
                    <div class="text-center py-5">
                        <div class="spinner-border text-success" role="status">
                            <span class="visually-hidden">Loading...</span>
                        </div>
                        <p class="mt-2">Fetching matches...</p>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Bootstrap Bundle with Popper -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

    <script>
        const matchList = document.getElementById('matchList');
        const refreshBtn = document.getElementById('refreshBtn');

        let matches = [];

        async function fetchMatches() {
            matchList.innerHTML = `
                <div class="text-center py-5">
                    <div class="spinner-border text-success" role="status">
                        <span class="visually-hidden">Loading...</span>
                    </div>
                    <p class="mt-2">Fetching today's matches...</p>
                </div>`;

            try {
                const response = await fetch('https://www.scorebat.com/video-api/v3/');
                const data = await response.json();

                if (data && data.response) {
                    matches = data.response.slice(0, 15).map((match, index) => {
                        const [home, away] = match.title.split(' - ');
                        const isLive = Math.random() > 0.5;
                        return {
                            id: index,
                            home: home || "Home Team",
                            away: away || "Away Team",
                            competition: match.competition,
                            date: new Date(match.date).toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'}),
                            predictions: generatePredictions(),
                            isLive: isLive,
                            score: { home: isLive ? Math.floor(Math.random() * 3) : 0, away: isLive ? Math.floor(Math.random() * 3) : 0 },
                            cards: {
                                homeYellow: isLive ? Math.floor(Math.random() * 3) : 0,
                                homeRed: isLive && Math.random() > 0.9 ? 1 : 0,
                                awayYellow: isLive ? Math.floor(Math.random() * 3) : 0,
                                awayRed: isLive && Math.random() > 0.9 ? 1 : 0
                            }
                        };
                    });
                } else {
                    throw new Error("No data");
                }
            } catch (error) {
                console.error("Fetch error, using fallback data:", error);
                matches = getFallbackMatches();
            }

            renderMatches();
        }

        function getFallbackMatches() {
            const teams = [
                ["Arsenal", "Man City"], ["Liverpool", "Chelsea"], ["Real Madrid", "Barcelona"],
                ["Bayern Munich", "Dortmund"], ["PSG", "Marseille"], ["Juventus", "AC Milan"],
                ["Man Utd", "Tottenham"], ["Atletico Madrid", "Sevilla"], ["Inter Milan", "Napoli"],
                ["Ajax", "PSV"], ["Benfica", "Porto"], ["Celtic", "Rangers"]
            ];
            const leagues = ["Premier League", "La Liga", "Bundesliga", "Ligue 1", "Serie A", "Eredivisie"];

            return Array.from({length: 10}, (_, i) => {
                const pair = teams[Math.floor(Math.random() * teams.length)];
                const isLive = Math.random() > 0.5;
                return {
                    id: i,
                    home: pair[0],
                    away: pair[1],
                    competition: leagues[Math.floor(Math.random() * leagues.length)],
                    date: "Today " + (12 + Math.floor(Math.random() * 10)) + ":00",
                    predictions: generatePredictions(),
                    isLive: isLive,
                    score: { home: isLive ? Math.floor(Math.random() * 3) : 0, away: isLive ? Math.floor(Math.random() * 3) : 0 },
                    cards: {
                        homeYellow: isLive ? Math.floor(Math.random() * 3) : 0,
                        homeRed: isLive && Math.random() > 0.9 ? 1 : 0,
                        awayYellow: isLive ? Math.floor(Math.random() * 3) : 0,
                        awayRed: isLive && Math.random() > 0.9 ? 1 : 0
                    }
                };
            });
        }

        function generatePredictions() {
            const home = Math.floor(Math.random() * 50) + 20;
            const draw = Math.floor(Math.random() * 20) + 10;
            const away = 100 - home - draw;

            return {
                home,
                draw,
                away,
                odds: {
                    home: (100 / home).toFixed(2),
                    draw: (100 / draw).toFixed(2),
                    away: (100 / away).toFixed(2)
                }
            };
        }

        function renderMatches() {
            matchList.innerHTML = '';
            matches.forEach(match => {
                const card = document.createElement('div');
                card.className = 'col-md-6 col-lg-4';

                const probs = match.predictions;
                let predictedWinner = "Draw";
                let winnerColor = "warning";

                if (probs.home > probs.draw && probs.home > probs.away) {
                    predictedWinner = match.home;
                    winnerColor = "success";
                } else if (probs.away > probs.home && probs.away > probs.draw) {
                    predictedWinner = match.away;
                    winnerColor = "danger";
                }

                card.innerHTML = `
                    <div class="card match-card ${match.isLive ? 'border-danger' : ''}">
                        <div class="card-body">
                            <div class="d-flex justify-content-between align-items-center mb-2">
                                <span class="badge bg-secondary">${match.competition}</span>
                                ${match.isLive ? '<span class="badge bg-danger animate-pulse">LIVE</span>' : '<span class="small text-muted">' + match.date + '</span>'}
                            </div>
                            <div class="row align-items-center text-center my-3">
                                <div class="col-5">
                                    <h6 class="mb-1">${match.home}</h6>
                                    ${match.isLive ? `
                                        <div class="small">
                                            <span class="text-warning"><i class="fas fa-square"></i> ${match.cards.homeYellow}</span>
                                            <span class="text-danger ms-1"><i class="fas fa-square"></i> ${match.cards.homeRed}</span>
                                        </div>
                                    ` : ''}
                                </div>
                                <div class="col-2 px-0">
                                    <div class="h4 mb-0">${match.isLive ? match.score.home + ':' + match.score.away : 'VS'}</div>
                                </div>
                                <div class="col-5">
                                    <h6 class="mb-1">${match.away}</h6>
                                    ${match.isLive ? `
                                        <div class="small">
                                            <span class="text-warning"><i class="fas fa-square"></i> ${match.cards.awayYellow}</span>
                                            <span class="text-danger ms-1"><i class="fas fa-square"></i> ${match.cards.awayRed}</span>
                                        </div>
                                    ` : ''}
                                </div>
                            </div>
                            <div class="text-center mb-3">
                                <span class="small text-muted">Predicted Winner:</span>
                                <span class="badge bg-${winnerColor} ms-1">${predictedWinner}</span>
                            </div>
                            <div class="row mb-3 text-center g-2">
                                <div class="col-4">
                                    <div class="p-2 bg-light rounded shadow-sm">
                                        <div class="small text-muted">Home</div>
                                        <div class="fw-bold text-success">${probs.home}%</div>
                                        <div class="small fw-bold">@${probs.odds.home}</div>
                                    </div>
                                </div>
                                <div class="col-4">
                                    <div class="p-2 bg-light rounded shadow-sm">
                                        <div class="small text-muted">Draw</div>
                                        <div class="fw-bold text-warning">${probs.draw}%</div>
                                        <div class="small fw-bold">@${probs.odds.draw}</div>
                                    </div>
                                </div>
                                <div class="col-4">
                                    <div class="p-2 bg-light rounded shadow-sm">
                                        <div class="small text-muted">Away</div>
                                        <div class="fw-bold text-danger">${probs.away}%</div>
                                        <div class="small fw-bold">@${probs.odds.away}</div>
                                    </div>
                                </div>
                            </div>
                            <div class="progress probability-bar mb-3">
                                <div class="progress-bar bg-success" role="progressbar" style="width: ${probs.home}%"></div>
                                <div class="progress-bar bg-warning" role="progressbar" style="width: ${probs.draw}%"></div>
                                <div class="progress-bar bg-danger" role="progressbar" style="width: ${probs.away}%"></div>
                            </div>
                            <div class="d-grid">
                                <a href="https://www.google.com/search?q=${encodeURIComponent(match.home + ' vs ' + match.away + ' stats prediction')}" target="_blank" class="btn btn-sm btn-outline-primary">
                                    <i class="fab fa-google me-1"></i> Match Analytics
                                </a>
                            </div>
                        </div>
                    </div>
                `;
                matchList.appendChild(card);
            });
        }

        refreshBtn.addEventListener('click', fetchMatches);

        // Initial Load
        fetchMatches();

        // Live Update Simulation
        setInterval(() => {
            let updated = false;
            matches.forEach(match => {
                if (match.isLive) {
                    // Randomly increase score
                    if (Math.random() > 0.95) {
                        if (Math.random() > 0.5) match.score.home++;
                        else match.score.away++;
                        updated = true;
                    }
                    // Randomly add cards
                    if (Math.random() > 0.98) {
                        const team = Math.random() > 0.5 ? 'home' : 'away';
                        if (Math.random() > 0.8) match.cards[team + 'Red']++;
                        else match.cards[team + 'Yellow']++;
                        updated = true;
                    }
                }
            });
            if (updated) renderMatches();
        }, 30000); // Update every 30 seconds
    </script>
</body>
</html>
