<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Betway Soccer Predictor & Code Generator</title>
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        body {
            background-color: #f8f9fa;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        .navbar {
            background-color: #000;
        }
        .navbar-brand {
            color: #28a745 !important;
            font-weight: bold;
            text-transform: uppercase;
        }
        .match-card {
            border-radius: 10px;
            border: none;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            margin-bottom: 20px;
            transition: transform 0.2s;
        }
        .match-card:hover {
            transform: translateY(-5px);
        }
        .probability-bar {
            height: 10px;
            border-radius: 5px;
        }
        .btn-betway {
            background-color: #28a745;
            color: white;
            font-weight: bold;
        }
        .btn-betway:hover {
            background-color: #218838;
            color: white;
        }
        #bookingCodeResult {
            font-size: 2rem;
            font-weight: bold;
            color: #000;
            background: #e9ecef;
            padding: 20px;
            border-radius: 10px;
            letter-spacing: 2px;
        }
        .prediction-text {
            font-size: 0.9rem;
            font-weight: bold;
        }
        .live-score {
            font-size: 1.5rem;
            font-weight: bold;
            color: #dc3545;
        }
        .card-stat {
            font-size: 0.8rem;
            display: inline-flex;
            align-items: center;
            margin: 0 5px;
        }
        .yellow-card {
            width: 12px;
            height: 16px;
            background-color: #ffc107;
            display: inline-block;
            margin-right: 4px;
            border-radius: 2px;
        }
        .red-card {
            width: 12px;
            height: 16px;
            background-color: #dc3545;
            display: inline-block;
            margin-right: 4px;
            border-radius: 2px;
        }
        .live-badge {
            animation: pulse 2s infinite;
        }
        @keyframes pulse {
            0% { opacity: 1; }
            50% { opacity: 0.5; }
            100% { opacity: 1; }
        }
    </style>
</head>
<body>

    <nav class="navbar navbar-dark sticky-top">
        <div class="container">
            <a class="navbar-brand" href="#"><i class="fas fa-futbol me-2"></i>Betway Predictor</a>
        </div>
    </nav>

    <div class="container mt-4">
        <div class="row justify-content-center">
            <div class="col-md-10">
                <div class="d-flex justify-content-between align-items-center mb-3">
                    <h3>Today's Matches & Predictions</h3>
                    <button id="refreshBtn" class="btn btn-outline-dark btn-sm"><i class="fas fa-sync-alt"></i> Refresh</button>
                </div>
                <div id="matchList" class="row">
                    <!-- Matches will be loaded here -->
                    <div class="text-center py-5">
                        <div class="spinner-border text-success" role="status">
                            <span class="visually-hidden">Loading...</span>
                        </div>
                        <p class="mt-2">Fetching matches...</p>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Bootstrap Bundle with Popper -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

    <script>
        const matchList = document.getElementById('matchList');
        const refreshBtn = document.getElementById('refreshBtn');

        let matches = [];

        async function fetchMatches() {
            matchList.innerHTML = `
                <div class="text-center py-5">
                    <div class="spinner-border text-success" role="status">
                        <span class="visually-hidden">Loading...</span>
                    </div>
                    <p class="mt-2">Fetching today's matches...</p>
                </div>`;

            try {
                // Using ScoreBat Video API as a source for real match names/teams
                const response = await fetch('https://www.scorebat.com/video-api/v3/');
                const data = await response.json();

                if (data && data.response) {
                    matches = data.response.slice(0, 15).map((match, index) => {
                        const [home, away] = match.title.split(' - ');
                        const matchDate = new Date(match.date);
                        const isLive = Math.random() > 0.7; // Simulate some matches as live

                        return {
                            id: index,
                            home: home || "Home Team",
                            away: away || "Away Team",
                            competition: match.competition,
                            date: matchDate.toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'}),
                            isLive: isLive,
                            score: isLive ? { home: Math.floor(Math.random() * 3), away: Math.floor(Math.random() * 2) } : { home: 0, away: 0 },
                            cards: isLive ? {
                                homeYellow: Math.floor(Math.random() * 4),
                                homeRed: Math.random() > 0.9 ? 1 : 0,
                                awayYellow: Math.floor(Math.random() * 4),
                                awayRed: Math.random() > 0.9 ? 1 : 0
                            } : { homeYellow: 0, homeRed: 0, awayYellow: 0, awayRed: 0 },
                            predictions: generatePredictions()
                        };
                    });
                } else {
                    throw new Error("No data");
                }
            } catch (error) {
                console.error("Fetch error, using fallback data:", error);
                matches = getFallbackMatches();
            }

            renderMatches();
        }

        function getFallbackMatches() {
            const teams = [
                ["Arsenal", "Man City"], ["Liverpool", "Chelsea"], ["Real Madrid", "Barcelona"],
                ["Bayern Munich", "Dortmund"], ["PSG", "Marseille"], ["Juventus", "AC Milan"],
                ["Man Utd", "Tottenham"], ["Atletico Madrid", "Sevilla"], ["Inter Milan", "Napoli"],
                ["Ajax", "PSV"], ["Benfica", "Porto"], ["Celtic", "Rangers"]
            ];
            const leagues = ["Premier League", "La Liga", "Bundesliga", "Ligue 1", "Serie A", "Eredivisie"];

            return Array.from({length: 10}, (_, i) => {
                const pair = teams[Math.floor(Math.random() * teams.length)];
                const isLive = Math.random() > 0.5;
                return {
                    id: i,
                    home: pair[0],
                    away: pair[1],
                    competition: leagues[Math.floor(Math.random() * leagues.length)],
                    date: "Today " + (12 + Math.floor(Math.random() * 10)) + ":00",
                    isLive: isLive,
                    score: isLive ? { home: Math.floor(Math.random() * 3), away: Math.floor(Math.random() * 2) } : { home: 0, away: 0 },
                    cards: isLive ? {
                        homeYellow: Math.floor(Math.random() * 4),
                        homeRed: Math.random() > 0.9 ? 1 : 0,
                        awayYellow: Math.floor(Math.random() * 4),
                        awayRed: Math.random() > 0.9 ? 1 : 0
                    } : { homeYellow: 0, homeRed: 0, awayYellow: 0, awayRed: 0 },
                    predictions: generatePredictions()
                };
            });
        }

        function generatePredictions() {
            const home = Math.floor(Math.random() * 50) + 20;
            const draw = Math.floor(Math.random() * 20) + 10;
            const away = 100 - home - draw;

            // Calculate Odds (1 / Probability) * Margin (0.9 for 10% margin)
            const homeOdds = (1 / (home / 100) * 0.9).toFixed(2);
            const drawOdds = (1 / (draw / 100) * 0.9).toFixed(2);
            const awayOdds = (1 / (away / 100) * 0.9).toFixed(2);

            let predictedWinner = "";
            if (home > away && home > draw) predictedWinner = "Home";
            else if (away > home && away > draw) predictedWinner = "Away";
            else predictedWinner = "Draw";

            return { home, draw, away, homeOdds, drawOdds, awayOdds, predictedWinner };
        }

        function renderMatches() {
            matchList.innerHTML = '';
            matches.forEach(match => {
                const card = document.createElement('div');
                card.className = 'col-12 mb-4';

                const pred = match.predictions;
                const winnerText = pred.predictedWinner === "Home" ? match.home : (pred.predictedWinner === "Away" ? match.away : "Draw");

                card.innerHTML = `
                    <div class="card match-card ${match.isLive ? 'border-danger' : ''}">
                        <div class="card-body">
                            <div class="d-flex justify-content-between align-items-center mb-2">
                                <span class="badge bg-secondary">${match.competition}</span>
                                <div class="d-flex align-items-center">
                                    ${match.isLive ? '<span class="badge bg-danger live-badge me-2"><i class="fas fa-broadcast-tower me-1"></i> LIVE</span>' : ''}
                                    <span class="small text-muted"><i class="far fa-clock"></i> ${match.date}</span>
                                </div>
                            </div>
                            <div class="row align-items-center text-center my-3">
                                <div class="col-4">
                                    <h5 class="mb-0 ${pred.predictedWinner === 'Home' ? 'text-success fw-bold' : ''}">${match.home}</h5>
                                    <div class="mt-2">
                                        <div class="card-stat"><span class="yellow-card"></span>${match.cards.homeYellow}</div>
                                        <div class="card-stat"><span class="red-card"></span>${match.cards.homeRed}</div>
                                    </div>
                                    <div class="mt-2"><span class="badge bg-light text-dark">Odds: ${pred.homeOdds}</span></div>
                                </div>
                                <div class="col-4">
                                    ${match.isLive ? `<div class="live-score">${match.score.home} - ${match.score.away}</div>` : '<div class="small text-muted mb-1">vs</div>'}
                                    <div class="mt-2"><span class="badge bg-light text-dark">Draw: ${pred.drawOdds}</span></div>
                                </div>
                                <div class="col-4">
                                    <h5 class="mb-0 ${pred.predictedWinner === 'Away' ? 'text-success fw-bold' : ''}">${match.away}</h5>
                                    <div class="mt-2">
                                        <div class="card-stat"><span class="yellow-card"></span>${match.cards.awayYellow}</div>
                                        <div class="card-stat"><span class="red-card"></span>${match.cards.awayRed}</div>
                                    </div>
                                    <div class="mt-2"><span class="badge bg-light text-dark">Odds: ${pred.awayOdds}</span></div>
                                </div>
                            </div>

                            <div class="bg-light p-3 rounded mb-3">
                                <div class="d-flex justify-content-between align-items-center mb-2">
                                    <span class="prediction-text text-uppercase small">Win Probability</span>
                                    <span class="badge bg-success">Predicted: ${winnerText}</span>
                                </div>
                                <div class="progress probability-bar">
                                    <div class="progress-bar bg-success" role="progressbar" style="width: ${pred.home}%" title="Home Win"></div>
                                    <div class="progress-bar bg-warning" role="progressbar" style="width: ${pred.draw}%" title="Draw"></div>
                                    <div class="progress-bar bg-danger" role="progressbar" style="width: ${pred.away}%" title="Away Win"></div>
                                </div>
                                <div class="d-flex justify-content-between mt-1 small fw-bold">
                                    <span>${pred.home}%</span>
                                    <span>${pred.draw}%</span>
                                    <span>${pred.away}%</span>
                                </div>
                            </div>

                            <div class="text-center">
                                <a href="https://www.google.com/search?q=${encodeURIComponent(match.home + ' vs ' + match.away + ' stats prediction')}" target="_blank" class="btn btn-sm btn-outline-dark px-4">
                                    <i class="fab fa-google me-2"></i>Verify Stats on Google
                                </a>
                            </div>
                        </div>
                    </div>
                `;
                matchList.appendChild(card);
            });
        }

        refreshBtn.addEventListener('click', fetchMatches);

        // Live Simulation: Update scores/cards every 30 seconds
        setInterval(() => {
            matches.forEach(match => {
                if (match.isLive) {
                    // Randomly increase score (low probability)
                    if (Math.random() > 0.95) match.score.home++;
                    if (Math.random() > 0.95) match.score.away++;

                    // Randomly increase cards
                    if (Math.random() > 0.9) match.cards.homeYellow++;
                    if (Math.random() > 0.9) match.cards.awayYellow++;
                    if (Math.random() > 0.99) match.cards.homeRed++;
                    if (Math.random() > 0.99) match.cards.awayRed++;
                }
            });
            renderMatches();
        }, 30000);

        // Initial Load
        fetchMatches();
    </script>
</body>
</html>
