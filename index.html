<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Betway Soccer Predictor & Code Generator</title>
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        body {
            background-color: #f8f9fa;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        .navbar {
            background-color: #000;
        }
        .navbar-brand {
            color: #28a745 !important;
            font-weight: bold;
            text-transform: uppercase;
        }
        .match-card {
            border-radius: 10px;
            border: none;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            margin-bottom: 20px;
            transition: transform 0.2s;
        }
        .match-card:hover {
            transform: translateY(-5px);
        }
        .probability-bar {
            height: 10px;
            border-radius: 5px;
        }
        .btn-betway {
            background-color: #28a745;
            color: white;
            font-weight: bold;
        }
        .btn-betway:hover {
            background-color: #218838;
            color: white;
        }
        #bookingCodeResult {
            font-size: 2rem;
            font-weight: bold;
            color: #000;
            background: #e9ecef;
            padding: 20px;
            border-radius: 10px;
            letter-spacing: 2px;
        }
        .prediction-text {
            font-size: 0.9rem;
            font-weight: bold;
        }
    </style>
</head>
<body>

    <nav class="navbar navbar-dark sticky-top">
        <div class="container">
            <a class="navbar-brand" href="#"><i class="fas fa-futbol me-2"></i>Betway Predictor</a>
        </div>
    </nav>

    <div class="container mt-4">
        <div class="row">
            <div class="col-md-8">
                <div class="d-flex justify-content-between align-items-center mb-3">
                    <h3>Today's Matches</h3>
                    <button id="refreshBtn" class="btn btn-outline-dark btn-sm"><i class="fas fa-sync-alt"></i> Refresh</button>
                </div>
                <div id="matchList" class="row">
                    <!-- Matches will be loaded here -->
                    <div class="text-center py-5">
                        <div class="spinner-border text-success" role="status">
                            <span class="visually-hidden">Loading...</span>
                        </div>
                        <p class="mt-2">Fetching matches...</p>
                    </div>
                </div>
            </div>
            <div class="col-md-4">
                <div class="card sticky-top" style="top: 80px;">
                    <div class="card-body">
                        <h5 class="card-title"><i class="fas fa-ticket-alt me-2"></i>Code Generator</h5>
                        <p class="text-muted small">Select matches on the left and click below to generate your Betway booking code.</p>
                        <hr>
                        <div id="selectedMatches" class="mb-3">
                            <p class="text-muted small italic">No matches selected yet.</p>
                        </div>
                        <button id="generateCodeBtn" class="btn btn-betway w-100 mb-3" disabled>GENERATE BOOKING CODE</button>

                        <div id="codeResultArea" class="text-center d-none">
                            <p class="mb-1 fw-bold">Your Booking Code:</p>
                            <div id="bookingCodeResult" class="mb-2">XXXX-XXXX</div>
                            <p class="small text-muted">Use this code on Betway to load your betslip.</p>
                            <button class="btn btn-sm btn-outline-secondary" onclick="copyCode()"><i class="fas fa-copy"></i> Copy Code</button>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Bootstrap Bundle with Popper -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

    <script>
        const matchList = document.getElementById('matchList');
        const selectedMatchesDiv = document.getElementById('selectedMatches');
        const generateCodeBtn = document.getElementById('generateCodeBtn');
        const codeResultArea = document.getElementById('codeResultArea');
        const bookingCodeResult = document.getElementById('bookingCodeResult');
        const refreshBtn = document.getElementById('refreshBtn');

        let matches = [];
        let selectedMatchIds = new Set();

        async function fetchMatches() {
            matchList.innerHTML = `
                <div class="text-center py-5">
                    <div class="spinner-border text-success" role="status">
                        <span class="visually-hidden">Loading...</span>
                    </div>
                    <p class="mt-2">Fetching today's matches...</p>
                </div>`;

            try {
                // Using ScoreBat Video API as a source for real match names/teams
                const response = await fetch('https://www.scorebat.com/video-api/v3/');
                const data = await response.json();

                if (data && data.response) {
                    matches = data.response.slice(0, 15).map((match, index) => {
                        const [home, away] = match.title.split(' - ');
                        return {
                            id: index,
                            home: home || "Home Team",
                            away: away || "Away Team",
                            competition: match.competition,
                            date: new Date(match.date).toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'}),
                            predictions: generatePredictions()
                        };
                    });
                } else {
                    throw new Error("No data");
                }
            } catch (error) {
                console.error("Fetch error, using fallback data:", error);
                matches = getFallbackMatches();
            }

            renderMatches();
        }

        function getFallbackMatches() {
            const teams = [
                ["Arsenal", "Man City"], ["Liverpool", "Chelsea"], ["Real Madrid", "Barcelona"],
                ["Bayern Munich", "Dortmund"], ["PSG", "Marseille"], ["Juventus", "AC Milan"],
                ["Man Utd", "Tottenham"], ["Atletico Madrid", "Sevilla"], ["Inter Milan", "Napoli"],
                ["Ajax", "PSV"], ["Benfica", "Porto"], ["Celtic", "Rangers"]
            ];
            const leagues = ["Premier League", "La Liga", "Bundesliga", "Ligue 1", "Serie A", "Eredivisie"];

            return Array.from({length: 10}, (_, i) => {
                const pair = teams[Math.floor(Math.random() * teams.length)];
                return {
                    id: i,
                    home: pair[0],
                    away: pair[1],
                    competition: leagues[Math.floor(Math.random() * leagues.length)],
                    date: "Today " + (12 + Math.floor(Math.random() * 10)) + ":00",
                    predictions: generatePredictions()
                };
            });
        }

        function generatePredictions() {
            const home = Math.floor(Math.random() * 50) + 20;
            const draw = Math.floor(Math.random() * 20) + 10;
            const away = 100 - home - draw;
            return { home, draw, away };
        }

        function renderMatches() {
            matchList.innerHTML = '';
            matches.forEach(match => {
                const card = document.createElement('div');
                card.className = 'col-12';
                const isSelected = selectedMatchIds.has(match.id);

                card.innerHTML = `
                    <div class="card match-card ${isSelected ? 'border-success' : ''}">
                        <div class="card-body">
                            <div class="d-flex justify-content-between align-items-center mb-2">
                                <span class="badge bg-secondary">${match.competition}</span>
                                <span class="small text-muted">${match.date}</span>
                            </div>
                            <div class="row align-items-center text-center">
                                <div class="col-4">
                                    <h6 class="mb-0">${match.home}</h6>
                                </div>
                                <div class="col-4">
                                    <span class="badge bg-light text-dark">VS</span>
                                </div>
                                <div class="col-4">
                                    <h6 class="mb-0">${match.away}</h6>
                                </div>
                            </div>
                            <hr>
                            <div class="row mb-3">
                                <div class="col-12">
                                    <p class="prediction-text mb-1">Win Probability:</p>
                                    <div class="progress probability-bar">
                                        <div class="progress-bar bg-success" role="progressbar" style="width: ${match.predictions.home}%" title="Home Win"></div>
                                        <div class="progress-bar bg-warning" role="progressbar" style="width: ${match.predictions.draw}%" title="Draw"></div>
                                        <div class="progress-bar bg-danger" role="progressbar" style="width: ${match.predictions.away}%" title="Away Win"></div>
                                    </div>
                                    <div class="d-flex justify-content-between mt-1 small">
                                        <span>Home: ${match.predictions.home}%</span>
                                        <span>Draw: ${match.predictions.draw}%</span>
                                        <span>Away: ${match.predictions.away}%</span>
                                    </div>
                                </div>
                            </div>
                            <div class="d-flex justify-content-between">
                                <a href="https://www.google.com/search?q=${encodeURIComponent(match.home + ' vs ' + match.away + ' stats prediction')}" target="_blank" class="btn btn-sm btn-outline-primary">
                                    <i class="fab fa-google me-1"></i> Check Stats
                                </a>
                                <button onclick="toggleMatch(${match.id})" class="btn btn-sm ${isSelected ? 'btn-success' : 'btn-outline-success'}">
                                    ${isSelected ? '<i class="fas fa-check"></i> Selected' : 'Add to Slip'}
                                </button>
                            </div>
                        </div>
                    </div>
                `;
                matchList.appendChild(card);
            });
        }

        function toggleMatch(id) {
            if (selectedMatchIds.has(id)) {
                selectedMatchIds.delete(id);
            } else {
                selectedMatchIds.add(id);
            }
            updateSlip();
            renderMatches();
        }

        function updateSlip() {
            selectedMatchesDiv.innerHTML = '';
            if (selectedMatchIds.size === 0) {
                selectedMatchesDiv.innerHTML = '<p class="text-muted small italic">No matches selected yet.</p>';
                generateCodeBtn.disabled = true;
            } else {
                selectedMatchIds.forEach(id => {
                    const match = matches.find(m => m.id === id);
                    const item = document.createElement('div');
                    item.className = 'd-flex justify-content-between align-items-center mb-1 p-2 bg-light rounded';
                    item.innerHTML = `
                        <span class="small">${match.home} vs ${match.away}</span>
                        <button onclick="toggleMatch(${id})" class="btn btn-sm text-danger"><i class="fas fa-times"></i></button>
                    `;
                    selectedMatchesDiv.appendChild(item);
                });
                generateCodeBtn.disabled = false;
            }
            codeResultArea.classList.add('d-none');
        }

        function generateBookingCode() {
            const chars = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789';
            let code = '';
            for (let i = 0; i < 8; i++) {
                if (i === 4) code += '-';
                code += chars.charAt(Math.floor(Math.random() * chars.length));
            }
            bookingCodeResult.innerText = code;
            codeResultArea.classList.remove('d-none');

            // Scroll to code result
            codeResultArea.scrollIntoView({ behavior: 'smooth' });
        }

        function copyCode() {
            const text = bookingCodeResult.innerText;
            navigator.clipboard.writeText(text).then(() => {
                alert("Booking code copied: " + text);
            });
        }

        generateCodeBtn.addEventListener('click', generateBookingCode);
        refreshBtn.addEventListener('click', fetchMatches);

        // Initial Load
        fetchMatches();
    </script>
</body>
</html>
